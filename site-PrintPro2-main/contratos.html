<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Completo | PrintPro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="contratos.css">
</head>
<body>

    <header>
        <div class="logo">Print<span>Pro</span></div>
        <nav>
            <ul>
                <li><a href="index.html#home">Home</a></li>
                <li><a href="index.html#servicos">Serviços</a></li>
                <li><a href="contratos.html">Locação</a></li>
                <li><a href="index.html#contato">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main class="catalog-section">
        <div class="catalog-header">
            <h2 class="section-title">Nossa <span>Frota Completa</span></h2>
        </div>

        <div class="filter-wrapper">
            <details class="filter-dropdown">
                <summary class="filter-master-btn">
                    <i class="fas fa-filter"></i> FILTROS 
                    <i class="fas fa-chevron-down arrow"></i>
                </summary>
                <div class="filter-options">
                    <label><input type="checkbox" class="filter-check" value="Laser Mono"> Laser Monocromática</label>
                    <label><input type="checkbox" class="filter-check" value="Tanque de Tinta"> Colorida / Tanque</label>
                    <label><input type="checkbox" class="filter-check" value="Corporativa"> Alta Produção (Corporativa)</label>
                </div>
            </details>
        </div>

        <div id="grid-maquinas" class="machine-grid">
            <p style="color: white; text-align: center; grid-column: 1/-1;">Carregando frota...</p>
        </div>
    </main>

    <footer>
        <p>© 2026 PrintPro. Todos os direitos reservados.</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Substitua pelos seus dados do Firebase Console
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_PROJETO.firebaseapp.com",
            projectId: "SEU_PROJETO",
            storageBucket: "SEU_PROJETO.appspot.com",
            messagingSenderId: "ID",
            appId: "APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const grid = document.getElementById('grid-maquinas');
        let todasMaquinas = []; // Cache local para os filtros funcionarem rápido

        // 1. BUSCAR DADOS DO FIREBASE
        onSnapshot(collection(db, "maquinas"), (snapshot) => {
            todasMaquinas = [];
            snapshot.forEach(doc => {
                todasMaquinas.push({ id: doc.id, ...doc.data() });
            });
            renderizarMaquinas(todasMaquinas);
        });

        // 2. FUNÇÃO PARA CRIAR OS CARDS NO HTML
        function renderizarMaquinas(lista) {
            grid.innerHTML = "";
            
            if (lista.length === 0) {
                grid.innerHTML = "<p style='color:white; grid-column: 1/-1; text-align:center;'>Nenhuma máquina encontrada.</p>";
                return;
            }

            lista.forEach(m => {
                // Define a cor da tag baseado no tipo
                let tagClass = "mono";
                if (m.tipo.includes("Tanque") || m.tipo.includes("Colorida")) tagClass = "tank";
                if (m.tipo.includes("Corporativa")) tagClass = "corp";

                grid.innerHTML += `
                    <div class="machine-card">
                        <div class="type-tag ${tagClass}">${m.tipo}</div>
                        <div class="machine-icon">
                            <img src="${m.imagem_url}" alt="${m.nome}" class="img-maquina">
                        </div>
                        <h3>${m.nome}</h3>
                        <div class="specs-list">
                            <div class="spec-item"><i class="fas fa-copy"></i><p>Franquia: <span>${m.franquia}</span></p></div>
                            <div class="spec-item"><i class="fas fa-bolt"></i><p>Velocidade: <span>${m.velocidade}</span></p></div>
                            <div class="spec-item"><i class="fas fa-plug"></i><p>Conexão: <span>${m.conexoes}</span></p></div>
                        </div>
                        <a href="https://wa.me/48998619767?text=Olá! Tenho interesse na máquina ${m.nome}" class="btn-contract" target="_blank">Cotar Agora</a>
                    </div>`;
            });
        }

        // 3. LÓGICA DE FILTROS
        const checkboxes = document.querySelectorAll('.filter-check');
        
        checkboxes.forEach(box => {
            box.addEventListener('change', () => {
                const filtrosAtivos = Array.from(checkboxes)
                    .filter(i => i.checked)
                    .map(i => i.value);

                if (filtrosAtivos.length === 0) {
                    renderizarMaquinas(todasMaquinas); // Se nada marcado, mostra tudo
                } else {
                    const filtradas = todasMaquinas.filter(m => filtrosAtivos.includes(m.tipo));
                    renderizarMaquinas(filtradas);
                }
            });
        });
    </script>
</body>
</html>
