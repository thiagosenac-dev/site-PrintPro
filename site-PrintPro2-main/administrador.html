<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Chamados | PrintPro Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="administrador.css">
</head>
<body>

    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="logo">Print<span>Pro</span></div>
            <nav class="sidebar-nav">
                <a href="#" class="active" onclick="showSection('chamados')"><i class="fas fa-list"></i> Chamados</a>
                <a href="#" onclick="showSection('concluidos')"><i class="fas fa-check-double"></i> Concluídos</a>
                <a href="#" id="btn-logout" class="logout"><i class="fas fa-sign-out-alt"></i> Sair</a>
            </nav>
        </aside>

        <main class="main-content">
            <section id="section-chamados">
                <header class="main-header">
                    <h1>Gerenciamento de Chamados</h1>
                    <div class="admin-info">
                        <span>Bem-vindo, <strong>Admin</strong></span>
                    </div>
                </header>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Máquina</th>
                                <th>Descrição do Problema</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-chamados">
                            </tbody>
                    </table>
                </div>
            </section>

            <section id="section-concluidos" style="display: none;">
                <header class="main-header">
                    <h1>Chamados Concluídos</h1>
                </header>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Data Fim</th>
                                <th>Máquina</th>
                                <th>Resolução Final</th>
                                <th>Técnico</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-concluidos">
                            </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <div class="modal-overlay" id="modalEditar">
        <div class="modal-card">
            <h2>Atualizar Chamado</h2>
            <form id="form-editar">
                <div class="form-group">
                    <label>Alterar Status</label>
                    <select id="edit-status">
                        <option value="Pendente">Pendente</option>
                        <option value="Em Atendimento">Em Atendimento</option>
                        <option value="Aguardando Peça">Aguardando Peça</option>
                        <option value="Finalizado">Concluir (Mover para Concluídos)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Relatório Técnico</label>
                    <textarea id="edit-relatorio" placeholder="Descreva aqui o que foi feito..."></textarea>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="btn-cancel" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn-save">Salvar Alterações</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, query, onSnapshot, orderBy, doc, updateDoc, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_PROJETO.firebaseapp.com",
            projectId: "SEU_PROJETO",
            storageBucket: "SEU_PROJETO.appspot.com",
            messagingSenderId: "ID",
            appId: "APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- PROTEÇÃO E LOGOUT ---
        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = "login.html";
        });

        document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

        // --- LISTAGEM EM TEMPO REAL: CHAMADOS ABERTOS ---
        const qAbertos = query(
            collection(db, "chamados"), 
            where("status", "!=", "Finalizado"),
            orderBy("status"),
            orderBy("data_criacao", "desc")
        );

        onSnapshot(qAbertos, (snapshot) => {
            const tbody = document.getElementById('tabela-chamados');
            tbody.innerHTML = "";
            snapshot.forEach(doc => {
                const c = doc.data();
                tbody.innerHTML += `
                    <tr>
                        <td>${c.cliente_nome || 'Cliente'}</td>
                        <td class="tag-id">${c.maquina_tag}</td>
                        <td>${c.descricao}</td>
                        <td><span class="status-badge">${c.status}</span></td>
                        <td>
                            <button class="btn-edit" onclick="abrirModalEdicao('${doc.id}', '${c.status}', '${c.resolucao || ''}')">
                                <i class="fas fa-edit"></i> Editar
                            </button>
                        </td>
                    </tr>`;
            });
        });

        // --- LISTAGEM EM TEMPO REAL: CHAMADOS CONCLUÍDOS ---
        const qConcluidos = query(
            collection(db, "chamados"), 
            where("status", "==", "Finalizado"),
            orderBy("data_fim", "desc")
        );

        onSnapshot(qConcluidos, (snapshot) => {
            const tbody = document.getElementById('tabela-concluidos');
            tbody.innerHTML = "";
            snapshot.forEach(doc => {
                const c = doc.data();
                const dataFormatada = c.data_fim ? new Date(c.data_fim.seconds * 1000).toLocaleDateString() : '---';
                tbody.innerHTML += `
                    <tr>
                        <td>${dataFormatada}</td>
                        <td class="tag-id">${c.maquina_tag}</td>
                        <td>${c.resolucao || 'Sem detalhes'}</td>
                        <td>${c.tecnico || 'Admin'}</td>
                        <td><span class="status-badge status-concluido">Finalizado</span></td>
                    </tr>`;
            });
        });

        // --- LÓGICA DO MODAL ---
        let idSendoEditado = "";
        window.abrirModalEdicao = (id, status, resolucao) => {
            idSendoEditado = id;
            document.getElementById('edit-status').value = status;
            document.getElementById('edit-relatorio').value = resolucao;
            document.getElementById('modalEditar').style.display = 'flex';
        };

        document.getElementById('form-editar').addEventListener('submit', async (e) => {
            e.preventDefault();
            const novoStatus = document.getElementById('edit-status').value;
            const relato = document.getElementById('edit-relatorio').value;

            const docRef = doc(db, "chamados", idSendoEditado);
            const updateData = {
                status: novoStatus,
                resolucao: relato
            };

            if (novoStatus === "Finalizado") {
                updateData.data_fim = serverTimestamp();
            }

            try {
                await updateDoc(docRef, updateData);
                closeModal();
            } catch (err) {
                alert("Erro ao atualizar!");
            }
        });

        // Funções de UI
        window.showSection = (id) => {
            document.getElementById('section-chamados').style.display = 'none';
            document.getElementById('section-concluidos').style.display = 'none';
            document.getElementById('section-' + id).style.display = 'block';
            document.querySelectorAll('.sidebar-nav a').forEach(a => a.classList.remove('active'));
            event.currentTarget.classList.add('active');
        };

        window.closeModal = () => document.getElementById('modalEditar').style.display = 'none';
    </script>
</body>
</html>
