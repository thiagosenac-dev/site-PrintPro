<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrativo | PrintPro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .login-body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--dark);
        }
        .login-card {
            background: var(--dark-surface);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(108, 92, 231, 0.2);
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .login-card h2 { margin-bottom: 10px; color: var(--white); }
        .login-card p { color: var(--text-gray); font-size: 0.9rem; margin-bottom: 25px; }
        
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #3e4463;
            background: #252a41;
            color: white;
            outline: none;
        }
        .btn-login {
            width: 100%;
            border: none;
            cursor: pointer;
            margin-top: 10px;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            background-color: var(--primary); /* Certifique-se que --primary existe no seu style.css */
            color: white;
            transition: 0.3s;
        }
        .btn-login:hover {
            filter: brightness(1.2);
        }
    </style>
</head>
<body class="login-body">

    <div class="login-card">
        <div class="logo" style="margin-bottom: 20px;">Print<span>Pro</span></div>
        <h2>Painel Interno</h2>
        <p>Insira suas credenciais para gerenciar os chamados.</p>
        
        <form id="login-form">
            <div class="input-group">
                <input type="email" id="login-email" placeholder="E-mail" required>
            </div>
            <div class="input-group">
                <input type="password" id="login-password" placeholder="Senha" required>
            </div>
            
            <button type="submit" class="btn-login">Entrar no Sistema</button>
        </form>
        
        <div style="margin-top: 20px;">
            <a href="index.html" style="color: var(--text-gray); text-decoration: none; font-size: 0.8rem;">Voltar para o site</a>
        </div>
    </div>

    <script type="module">
        // 1. Importar as ferramentas necessárias
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // 2. Tua configuração do Firebase (COPIA DO TEU CONSOLE)
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "seu-projeto.firebaseapp.com",
            projectId: "seu-projeto",
            storageBucket: "seu-projeto.appspot.com",
            messagingSenderId: "ID",
            appId: "APP_ID"
        };

        // 3. Inicializar
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const loginForm = document.getElementById('login-form');

        // 4. Escutar o envio do formulário
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault(); // Impede a página de recarregar

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                // Tenta fazer o login no Firebase
                await signInWithEmailAndPassword(auth, email, password);
                
                // Se der certo, vai para o painel
                window.location.href = "administrador.html";
            } catch (error) {
                // Se der erro (senha errada, user não existe), avisa o usuário
                console.error("Erro no login:", error.code);
                alert("Acesso negado: E-mail ou senha incorretos.");
            }
        });
    </script>

</body>
</html>
